# Releasing the core: checks first, then the mechanical part.
#
# Push a tag and this does the rest:
#
#     git tag v1.3.2-rc1 && git push origin v1.3.2-rc1   # a pre-release to try out
#     git tag v1.3.2     && git push origin v1.3.2       # the real thing
#
# A tag containing '-' is published as a pre-release. Nothing reaches the board
# manager index unless the checks and every compilation have passed.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write          # needed to create the release and to push to gh-pages

jobs:
  check:
    name: Check the core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consistency and release readiness
        run: python3 extras/check_core.py --tag "${GITHUB_REF_NAME}"

  compile:
    name: Compile for every board
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          path: XMiniCore

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 0.35.3
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Put the core where arduino-cli finds it
        run: |
          set -x
          arduino-cli version
          # Name the directory ourselves rather than asking arduino-cli for it:
          # 'config get' does not exist in every version, and a version that does
          # not know it prints its help instead of a path.
          SKETCHBOOK="$HOME/Arduino"
          arduino-cli config init --overwrite
          arduino-cli config set directories.user "$SKETCHBOOK"
          mkdir -p "$SKETCHBOOK/hardware/XMiniCore"
          cp -r XMiniCore "$SKETCHBOOK/hardware/XMiniCore/avr"
          test -f "$SKETCHBOOK/hardware/XMiniCore/avr/boards.txt" \
            || { echo "the core did not end up where it belongs"; exit 1; }
          arduino-cli core update-index              # nothing is installable without it
          arduino-cli core install arduino:avr       # for the toolchain the core uses
          arduino-cli core list
          arduino-cli board listall | head -20

      - name: Compile a sketch for every board and every menu combination
        run: python3 XMiniCore/extras/compile_all.py --fqbn-prefix XMiniCore:avr

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(python3 extras/changelog_entry.py "${GITHUB_REF_NAME}")
          PRE=""
          case "${GITHUB_REF_NAME}" in *-*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
             --notes "$NOTES" $PRE

      - name: Check out the branch that carries the index
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Add this version to the board manager index
        working-directory: pages
        run: |
          sleep 20          # give the release a moment to become visible to the API
          bash Boards_manager_release.sh "${GITHUB_REF_NAME}"

      - name: Commit and push the index
        working-directory: pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The index already knew about this version"
            exit 0
          fi
          git commit -m "${GITHUB_REF_NAME}"
          git push
