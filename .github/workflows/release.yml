# Releasing the core: checks first, then the mechanical part.
#
# Push a tag and this does the rest:
#
#     git tag v1.3.2-rc1 && git push origin v1.3.2-rc1   # a pre-release to try out
#     git tag v1.3.2     && git push origin v1.3.2       # the real thing
#
# A tag containing '-' is published as a pre-release. Nothing reaches the board
# manager index unless the checks and every compilation have passed.
#
# Without a tag the same checks run as an ordinary test: a push to main, a pull
# request or a run started by hand goes through the core check and the builds and
# stops there. Publishing hangs on the tag, not on the job.

name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release and to push to gh-pages

jobs:
  check:
    name: Check the core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consistency and release readiness
        env:
          # Only a tag says which version this is about. Without one the
          # version, the CHANGELOG and the tag itself are nothing to check
          # against, while everything else in the core still is.
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python3 extras/check_core.py --tag "$TAG"
          else
            python3 extras/check_core.py
          fi

  compile:
    name: Compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false          # one platform failing should not hide the others
      # A release gets all three. An ordinary push or pull request gets the
      # Linux runner: the three differ in their hook scripts and their paths
      # rather than in their compiler, and that is worth the runners when a
      # release is at stake or somebody asks for it.
      matrix:
        os: ${{ (github.event_name == 'pull_request'
                 || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')))
                && fromJSON('["ubuntu-latest"]')
                || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    defaults:
      run:
        shell: bash             # also on Windows, where the hooks are .bat anyway
    steps:
      - uses: actions/checkout@v4
        with:
          path: XMiniCore

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: arduino/setup-arduino-cli@v2

      - name: Keep Defender out of the build (Windows only)
        if: runner.os == 'Windows'
        continue-on-error: true      # a speed-up, not a requirement
        shell: pwsh
        run: |
          # A build writes thousands of small object files and the real-time
          # scanner opens every one of them. A parameter can only be given once,
          # so the several paths go in as one array.
          Add-MpPreference -ExclusionPath @("$HOME\Arduino with blank",
                                            "$HOME\work with blank",
                                            "$env:LOCALAPPDATA\Arduino15")
          Add-MpPreference -ExclusionProcess @("avr-gcc.exe", "avr-g++.exe",
                                               "avr-ar.exe", "avr-objcopy.exe",
                                               "avr-objdump.exe")
          Get-MpPreference | Select-Object -ExpandProperty ExclusionPath

      - name: Put the core where arduino-cli finds it
        run: |
          set -x
          arduino-cli version
          # The blank is deliberate: {runtime.platform.path} ends up in every
          # recipe and in the hook scripts, and an unquoted use of it only shows
          # when the path has one. Naming the directory ourselves is safer than
          # asking arduino-cli, whose 'config get' does not exist everywhere.
          SKETCHBOOK="$HOME/Arduino with blank"
          arduino-cli config init --overwrite
          arduino-cli config set directories.user "$SKETCHBOOK"
          mkdir -p "$SKETCHBOOK/hardware/XMiniCore"
          cp -r XMiniCore "$SKETCHBOOK/hardware/XMiniCore/avr"
          test -f "$SKETCHBOOK/hardware/XMiniCore/avr/boards.txt" \
            || { echo "the core did not end up where it belongs"; exit 1; }
          arduino-cli core update-index              # nothing is installable without it
          arduino-cli core install arduino:avr       # for the toolchain the core uses
          arduino-cli core list
          arduino-cli board listall | head -20

      - name: Compile
        run: |
          # Every platform builds every combination that can change the binary.
          # Windows was held to one of them while a build there seemed to cost
          # a minute; it costs eight seconds, and the minute was a full-disk
          # search in the prebuild hook rather than a build at all.
          python XMiniCore/extras/compile_all.py --fqbn-prefix XMiniCore:avr \
                 --work-dir "$HOME/work with blank" --timeout 300

      - name: Check that the prebuild hook picks up the pragmas
        run: |
          python XMiniCore/extras/check_hooks.py \
                 --fqbn XMiniCore:avr:atmega328p_xplained_mini \
                 --work-dir "$HOME/work with blank"

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: compile
    # The tag is what publishes. Everything above it is the test that a push or
    # a pull request gets as well, and this job is then skipped rather than
    # guarded step by step.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creating the release and adding it to the index are two steps, and
          # only the second one can fail in ways worth retrying. So skip this
          # when the release is already there, and a re-run of the job works.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "the release already exists, leaving it alone"
            exit 0
          fi
          NOTES=$(python3 extras/changelog_entry.py "${GITHUB_REF_NAME}")
          # Only a release candidate is preliminary. Not every tag with a
          # hyphen: DxCore carries -pre versions that are meant to be used,
          # and marking those as pre-releases would bury them.
          PRE=""
          case "${GITHUB_REF_NAME}" in *-rc*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
             --notes "$NOTES" $PRE

      - name: Check out the branch that carries the index
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Which index does this tag belong in?
        run: |
          # Release candidates go into an index of their own: the board manager
          # of an ordinary user never offers them, and several attempts at one
          # version stop cluttering the stable index. The name still matches
          # package_*_index.json, which the IDE demands of an index URL.
          # The scripts below read INDEX_FILE and fall back to the stable name.
          case "${GITHUB_REF_NAME}" in
            *-rc*) INDEX=package_felias-fogg_XMiniCore_rc_index.json ;;
            *)     INDEX=package_felias-fogg_XMiniCore_index.json ;;
          esac
          echo "INDEX_FILE=$INDEX" >> "$GITHUB_ENV"
          echo "This tag goes into $INDEX"

      - name: Offer the current avrdude
        working-directory: pages
        run: |
          # Adds the newest avrdude release to the index when it is not there
          # yet, and says so and stops when it is. Has to run before the core
          # entry, which depends on the newest avrdude the index knows.
          bash Add_avrdude_release.sh

      - name: Add this version to the board manager index
        working-directory: pages
        run: |
          sleep 20          # give the release a moment to become visible to the API
          bash Boards_manager_release.sh "${GITHUB_REF_NAME}"

      - name: Commit and push the index
        working-directory: pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The index already knew about this version"
            exit 0
          fi
          git commit -m "${GITHUB_REF_NAME}"
          git push
